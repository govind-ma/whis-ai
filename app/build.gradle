plugins {
    id 'com.android.application'
    // google-services plugin is applied conditionally below so the project
    // still compiles before the real google-services.json is dropped in.
}
def localProperties = new Properties()
localProperties.load(new FileInputStream(rootProject.file("local.properties")))


// ---------------------------------------------------------------------------
// Conditionally apply google-services plugin.
// The placeholder google-services.json ships in VCS so the build always has
// *something* to parse, but if a developer deletes it before adding the real
// one, the build must not crash — hence the file-existence check.
// ---------------------------------------------------------------------------
if (file("google-services.json").exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'com.whis.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.whis.app"
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName "2.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "GEMINI_API_KEY", "\"${localProperties['GEMINI_API_KEY']}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // ── Firebase (BOM + Firestore) ────────────────────────────────────────
    implementation platform('com.google.firebase:firebase-bom:34.16.0')
    implementation 'com.google.firebase:firebase-firestore'

    // ── Gemini Direct API ─────────────────────────────────────────────────
    implementation 'com.google.ai.client.generativeai:generativeai:0.7.0'

    // ── Networking ───────────────────────────────────────────────────────
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // ── AndroidX ─────────────────────────────────────────────────────────
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    // ── Material Components ──────────────────────────────────────────────
    implementation 'com.google.android.material:material:1.12.0'

    // ── Navigation Component (UI_PLAN.md §2.4 — 5-tab nav shell) ────────
    implementation 'androidx.navigation:navigation-fragment:2.9.0'
    implementation 'androidx.navigation:navigation-ui:2.9.0'

    // ── Room (set up now for MSG module's history DAO) ────────────────────
    implementation 'androidx.room:room-runtime:2.7.1'
    annotationProcessor 'androidx.room:room-compiler:2.7.1'

    // ── Dynamic Animation (SpringAnimation for swipe spring-back) ────────
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'

    // ── Testing ──────────────────────────────────────────────────────────
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
